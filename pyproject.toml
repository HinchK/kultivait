[project]
name = "kultivait"
version = "0.1.0"
description = "Local-first LLM routing proxy: weigh every prompt, route to the cheapest model that can carry it, tally the savings."
readme = "README.md"
authors = [
    { name = ".: HinchK :.", email = "kasey.hinchman@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "numpy>=2.5.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[project.scripts]
kultivait = "kultivait.cli:main"

[project.urls]
Homepage = "https://kultivait.ai"
Repository = "https://github.com/Standard-Pentest/kultivait"
Changelog = "https://github.com/Standard-Pentest/kultivait/blob/main/CHANGELOG.md"
